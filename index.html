<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5419fd" />
    <meta name="application-name" content="Nazaar" />
    <meta name="apple-mobile-web-app-title" content="Nazaar" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <title>Nazaar</title>
    <style>
      .boot-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090812;
      }
      html.light .boot-loader {
        background: #f7f6fc;
      }
      .boot-loader-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-loader-halo {
        position: absolute;
        inset: 4px;
        border-radius: 9999px;
        background: rgba(108, 56, 255, 0.25);
        filter: blur(18px);
        animation: bootHalo 2.2s ease-in-out infinite;
      }
      .boot-loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 3px solid rgba(108, 56, 255, 0.2);
        border-top-color: #6c38ff;
        animation: bootSpin 1.4s linear infinite;
      }
      html.light .boot-loader-ring {
        border-color: rgba(84, 25, 253, 0.18);
        border-top-color: #5419fd;
      }
      .boot-loader-img {
        position: relative;
        z-index: 1;
        width: 44px;
        height: 44px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(108, 56, 255, 0.35));
        animation: bootFloat 2.2s ease-in-out infinite;
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes bootFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.04); }
      }
      @keyframes bootHalo {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 0.7; transform: scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader-halo, .boot-loader-ring, .boot-loader-img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Cargando Nazaar">
        <div class="boot-loader-wrap">
          <div class="boot-loader-halo"></div>
          <div class="boot-loader-ring"></div>
          <img class="boot-loader-img" src="/icon.png" alt="Nazaar" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
